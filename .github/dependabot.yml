version: 2
updates:
  # npm — weekly, grouped by severity. Majors are a separate PR per dep
  # (not batched) so we can review them individually.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      # neodrag is a 3.0 prerelease whose "patch" bumps break the API, so it
      # moves as one group and is excluded from auto-merge.
      neodrag:
        patterns:
          - '@neodrag/*'
      # Patch groups match first and auto-merge (dependabot-auto-merge.yml);
      # a group reports its highest update type, so patch must stay separate.
      dev-deps-patch:
        dependency-type: 'development'
        update-types:
          - 'patch'
      peer-deps-patch:
        patterns:
          - 'svelte'
          - 'p5'
        update-types:
          - 'patch'
      # One PR for all minor updates across dev deps.
      dev-deps-minor:
        dependency-type: 'development'
        update-types:
          - 'minor'
      # One PR for all minor updates across runtime deps.
      peer-deps-minor:
        patterns:
          - 'svelte'
          - 'p5'
        update-types:
          - 'minor'
    ignore:
      # p5 v2 is a deliberate future release (see README roadmap). Bumps
      # to p5@2+ will be reintroduced when we explicitly support them.
      - dependency-name: 'p5'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'ci'
    groups:
      gh-actions:
        patterns:
          - '*'
