name: publish

# Builds and publishes one package to npm via OIDC trusted publishing. This
# file is the trusted publisher on npmjs.com for all three packages, and npm
# checks the top-level workflow name, so it only authenticates when run as its
# own workflow_dispatch: release-please.yml dispatches it per released package,
# and a maintainer can dispatch it by hand to republish an existing tag.
#
# `--provenance` makes the OIDC exchange explicit, so a failure surfaces as a
# clear auth error rather than a misleading 404 on the PUT.
#
# Preview builds do NOT go through here; they use pkg-pr-new in ci.yml.
#
# Do NOT rename this file without updating the trusted publisher entry for
# all three packages on npmjs.com.

on:
  workflow_dispatch:
    inputs:
      package-dir:
        description: 'Path to the package to publish'
        required: true
        type: choice
        options:
          - packages/core
          - packages/components
          - packages/viz
      npm-tag:
        description: 'npm dist-tag'
        required: false
        type: string
        default: latest
      ref:
        description: 'Git ref to check out (branch, tag, or SHA). Use a tag like components-v0.4.1 to republish a specific release.'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: true

      # NOTE: deliberately no `registry-url:` here. setup-node's registry-url
      # writes `.npmrc` with `_authToken=${NODE_AUTH_TOKEN}`, and with no token
      # provided that resolves to setup-node's literal placeholder
      # (`XXXXX-XXXXX-XXXXX-XXXXX`). npm then tries to auth with that bogus
      # token and never falls through to OIDC trusted publishing -> 404 on the
      # PUT. Omitting registry-url leaves no `_authToken`, so OIDC is used.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Guarantee an npm new enough for OIDC trusted publishing (>= 11.5.1).
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r --filter './packages/*' build

      - name: Publish ${{ inputs.package-dir }} with tag ${{ inputs.npm-tag }}
        working-directory: ${{ inputs.package-dir }}
        run: npm publish --provenance --tag ${{ inputs.npm-tag }}

      # `npm publish` has exited 0, printed `+ pkg@version` and written a
      # sigstore provenance statement without the version reaching the
      # registry. A green publish step is not proof; the registry is.
      # Propagation is not instant and is not uniform across packages in one
      # release, so poll rather than checking once.
      - name: Verify the version reached the registry
        working-directory: ${{ inputs.package-dir }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          URL="https://registry.npmjs.org/$NAME/$VERSION"
          echo "Waiting for $NAME@$VERSION"
          for i in $(seq 1 30); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Confirmed after $((i * 10))s."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$NAME@$VERSION is not on the registry after 5 minutes, but the publish step reported success."
          exit 1
