name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test (p5 ${{ matrix.p5 }})
    runs-on: ubuntu-latest
    # pkg-pr-new needs pull-requests: write to drop the sticky install-URL
    # comment on PRs. Safe on forks — GitHub Actions automatically downgrades
    # the token to read-only for PRs from forks, so external contributors
    # can't exploit the permission.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The committed lockfile; also runs the repo-wide checks.
          - p5: '2.x'
            primary: true
          - p5: '1.11'
            primary: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: true
          experimental: true

      - name: Install dependencies
        if: matrix.primary
        run: pnpm install --frozen-lockfile

      # p5 1.x ships no types, so this leg also adds @types/p5.
      - name: Install dependencies (p5 ${{ matrix.p5 }})
        if: ${{ !matrix.primary }}
        run: |
          sed -i -E 's/^(  p5:).*/\1 ^${{ matrix.p5 }}.0/' pnpm-workspace.yaml
          npm pkg set 'devDependencies.@types/p5=^1.7.7'
          pnpm install --no-frozen-lockfile
          pnpm --filter svelte-p5 exec node -p "'p5 ' + require('p5/package.json').version"

      # Build first so the example apps can resolve `svelte-p5` and
      # `svelte-p5-components` via the workspace symlink → dist/ chain
      # during their typecheck step. `pnpm build` only covers packages/*;
      # publint also runs here as part of each package's build script.
      - name: Build packages
        run: pnpm build

      - name: Lint
        if: matrix.primary
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @svelte-p5/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @svelte-p5/e2e exec playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @svelte-p5/e2e exec playwright install-deps chromium

      - name: Browser test
        run: pnpm test:browser

      - name: Check peer ranges
        if: matrix.primary
        run: pnpm check:peers

      - name: Compile-check doc snippets
        if: matrix.primary
        run: pnpm docs:snippets

      # Reads the npm registry, so it reports rather than gates: a registry
      # blip must not fail an unrelated PR.
      - name: Check upgrade docs are current
        if: matrix.primary
        continue-on-error: true
        run: pnpm docs:upgrade:check

      - name: Verify LICENSE in tarballs
        if: matrix.primary
        run: |
          for pkg in packages/core packages/components packages/viz; do
            (cd "$pkg" && npm pack --dry-run --json | jq -e '.[0].files | map(.path) | any(. == "LICENSE")')
          done

      # Continuous preview publishing via pkg-pr-new. Every PR + every push
      # to main publishes preview tarballs keyed by commit SHA to pkg.pr.new's
      # CDN and drops a sticky PR comment with exact install URLs. Replaces
      # the old `next` branch / `@alpha` dist-tag flow — no version bump, no
      # manifest ceremony, no npm registry pollution. Workspace deps between
      # the three packages are rewritten to each other's preview URLs
      # automatically so `pnpm add <url>` installs a coherent set.
      - name: Publish preview packages
        if: matrix.primary && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        run: pnpm dlx pkg-pr-new publish './packages/core' './packages/components' './packages/viz'

  # The ruleset requires a check named lint-and-build; this rolls up both legs.
  lint-and-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    steps:
      - name: Require every p5 leg to pass
        run: test "${{ needs.build-and-test.result }}" = success

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Validate commits
        run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose
