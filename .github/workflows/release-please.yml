name: release-please

# Stable release pipeline. A conventional-commit push to main opens/updates
# a release-please PR; merging it cuts tags + GitHub releases, and the
# dispatch-publish job below starts publish.yml once per released package,
# then upgrade-guide opens a PR regenerating docs/upgrading.md.
#
# Preview / canary builds are handled separately in ci.yml via pkg-pr-new —
# no dedicated workflow, no dist-tag, no manifest. See
# .github/CONTRIBUTING.md#branch--release-model for the full flow.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      core_tag: ${{ steps.release.outputs['packages/core--tag_name'] }}
      components_tag: ${{ steps.release.outputs['packages/components--tag_name'] }}
      viz_tag: ${{ steps.release.outputs['packages/viz--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm trusted publishing checks the top-level workflow, so publish.yml must
  # run as its own dispatch; under workflow_call it fails with ENEEDAUTH.
  dispatch-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASED: ${{ needs.release-please.outputs.paths_released }}
      OUTPUTS: ${{ toJson(needs.release-please.outputs) }}
    steps:
      - name: Dispatch publish.yml for each released package
        run: |
          for dir in $(echo "$RELEASED" | jq -r '.[]'); do
            tag=$(echo "$OUTPUTS" | jq -r --arg k "${dir#packages/}_tag" '.[$k]')
            echo "Dispatching publish.yml for $dir at $tag"
            gh workflow run publish.yml -f package-dir="$dir" -f ref="$tag" -f npm-tag=latest
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails this run if a dispatched publish never lands, so the release
      # does not look green while npm is missing a version.
      - name: Wait for each released version on the registry
        run: |
          for dir in $(echo "$RELEASED" | jq -r '.[]'); do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            url="https://registry.npmjs.org/$name/$version"
            for _ in $(seq 1 60); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ]; then
                echo "$name@$version is on the registry."
                continue 2
              fi
              sleep 15
            done
            echo "::error::$name@$version did not reach the registry within 15 minutes. Check the publish runs."
            exit 1
          done

  upgrade-guide:
    needs: dispatch-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      HUSKY: 0
    steps:
      # A PR pushed with GITHUB_TOKEN would not trigger the required CI checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Regenerate the upgrade guide
        run: pnpm docs:upgrade && pnpm exec prettier --write docs/upgrading.md

      - name: Open a PR if the guide changed
        run: |
          if git diff --quiet docs/upgrading.md; then
            echo "Upgrade guide already current."
            exit 0
          fi
          branch="docs/upgrade-guide-${GITHUB_SHA::7}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am 'docs: regenerate the upgrade guide after release'
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'docs: regenerate the upgrade guide after release' \
            --body 'Generated by release-please.yml after the release reached npm. The upgrade guide is built from the registry, so it can only be regenerated once the new versions exist.'
          gh pr merge "$branch" --auto --squash
