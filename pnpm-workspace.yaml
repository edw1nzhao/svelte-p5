packages:
  - 'packages/*'
  - 'site'
  - 'bench'
  - 'e2e'
  - 'docs/examples/*'

# Centralized devDep versions — referenced as "catalog:" in each
# package.json so Renovate/dependabot touches one file instead of five.
catalog:
  '@sveltejs/package': ^3.0.2
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/svelte': ^5.4.2
  '@testing-library/user-event': ^14.6.8
  '@tsconfig/svelte': ^5.0.0
  '@types/youtube': ^0.3.0
  '@vitest/coverage-v8': ^5.0.5
  happy-dom: ^21.0.4
  p5: ^2.3.4
  publint: ^0.3.25
  svelte: ^5.57.3
  svelte-check: ^4.7.7
  tslib: ^2.8.0
  typescript: ^6.0.3
  vite: ^8.3.5
  vitest: ^5.0.5
